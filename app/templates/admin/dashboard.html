{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <div>
    <h1 class="h4 mb-1">Dashboard Admin</h1>
    <div class="text-muted">Ringkasan sistem & performa model terbaru</div>
  </div>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary" href="/admin/datasets">Datasets</a>
    <a class="btn btn-outline-secondary" href="/admin/models">Models</a>
    <a class="btn btn-primary" href="/admin/train">Training</a>
  </div>
</div>

<div class="row g-3 mb-3">
  <div class="col-md-4">
    <div class="card p-3">
      <div class="text-muted">Datasets</div>
      <div class="display-6">{{ ds_count }}</div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card p-3">
      <div class="text-muted">Models</div>
      <div class="display-6">{{ model_count }}</div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card p-3">
      <div class="text-muted">Users</div>
      <div class="display-6">{{ user_count }}</div>
    </div>
  </div>
</div>

<div class="card p-3">
  <div class="d-flex align-items-center justify-content-between">
    <div>
      <div class="fw-semibold">Accuracy (Model Terbaru)</div>
      <div class="text-muted small">Hanya untuk model klasifikasi</div>
    </div>
    <div class="small text-muted">Chart.js</div>
  </div>
  <div class="mt-3">
    <canvas id="accChart" height="120"></canvas>
  </div>
</div>

<script>
  const labels = {{ labels|tojson }};
  const data = {{ accs|tojson }};
  const ctx = document.getElementById('accChart');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{ label: 'Accuracy', data }]
    },
    options: {
      responsive: true,
      scales: { y: { min: 0, max: 1 } }
    }
  });
</script>
{% endblock %}
