{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <div>
    <h1 class="h4 mb-1">Upload Dataset</h1>
    <div class="text-muted">CSV atau Excel</div>
  </div>
  <a class="btn btn-outline-secondary" href="/admin/datasets">Kembali</a>
</div>

<div class="card p-4">
  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  <form method="post" action="/admin/datasets/upload" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Nama Dataset</label>
      <input class="form-control" name="name" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Jenis</label>
      <select class="form-select" name="kind">
        <option value="classification">classification</option>
        <option value="clustering">clustering</option>
        <option value="association">association</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">File</label>
      <input class="form-control" type="file" name="file" accept=".csv,.xlsx,.xls" required />
    </div>
    <button class="btn btn-primary" type="submit">Upload</button>
  </form>
</div>
{% endblock %}
